<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restablecer contraseña | Café Paraíso</title>
<meta name="description" content="Restablece de forma segura la contraseña de tu cuenta de Café Paraíso.">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet" integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk" crossorigin="anonymous">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/pages/reset-password.css">
<link rel="icon" href="/favicon.ico" sizes="any">
</head>
<body>
<div id="navbar"></div>

<main class="page-account">
    <section class="account-hero reset-password-hero">
        <div class="container">
            <span class="caracol-section-badge">Seguridad</span>
            <h1>Restablecer contraseña</h1>
            <p>Elige una nueva contraseña para recuperar el acceso a tu cuenta.</p>
        </div>
    </section>

    <section class="account-section reset-password-section">
        <div class="container">
            <div id="password-loading" class="account-message">
                <i class="bi bi-arrow-repeat spin"></i> Comprobando tu sesión...
            </div>

            <div id="password-error" class="account-message account-message-error d-none">
                <i class="bi bi-exclamation-circle"></i>
                <span id="password-error-text">No se pudo cargar esta página.</span>
            </div>

            <article id="password-content" class="account-card reset-password-card d-none">
                <div class="account-card-header">
                    <div class="account-icon"><i class="bi bi-key"></i></div>
                    <div>
                        <h2>Nueva contraseña</h2>
                        <p>Utiliza una contraseña de al menos 6 caracteres.</p>
                    </div>
                </div>

                <form id="password-form" novalidate>
                    <div class="caracol-form-group">
                        <label class="caracol-form-label" for="new-password">Nueva contraseña</label>
                        <input class="caracol-form-control" id="new-password" type="password"
                               autocomplete="new-password" minlength="6" maxlength="128" required>
                    </div>

                    <div class="caracol-form-group">
                        <label class="caracol-form-label" for="confirm-password">Repetir nueva contraseña</label>
                        <input class="caracol-form-control" id="confirm-password" type="password"
                               autocomplete="new-password" minlength="6" maxlength="128" required>
                    </div>

                    <button class="caracol-btn caracol-btn-primary account-submit" type="submit" id="password-submit">
                        Guardar nueva contraseña <i class="bi bi-check2"></i>
                    </button>

                    <div id="password-status" class="account-status d-none" role="status" aria-live="polite"></div>
                </form>

                <a class="reset-password-back" href="login.html">
                    <i class="bi bi-arrow-left"></i> Volver al inicio de sesión
                </a>
            </article>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
<script src="services/config/runtime-config.js"></script>
<script src="services/config/supabase.js"></script>
<script src="services/auth.js"></script>
<script src="assets/js/components.js"></script>
<script src="components/navbar/navbar.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/reset-password.js"></script>
</body>
</html>
