<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Correo confirmado | Café Paraíso</title>
    <meta
        name="description"
        content="Tu cuenta de Café Paraíso ha sido verificada correctamente."
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
     integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
     integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk" crossorigin="anonymous">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/pages/confirmacion.css">
    <link rel="icon" href="/favicon.ico" sizes="any">
</head>

<body>
    <main class="page-confirmation">
        <section
            class="confirmation-card"
            aria-labelledby="confirmation-title"
        >
            <div class="confirmation-icon" aria-hidden="true">
                <i class="bi bi-check-lg"></i>
            </div>

            <span class="confirmation-badge">
                Cuenta verificada
            </span>

            <h1 id="confirmation-title">
                Correo confirmado correctamente
            </h1>

            <p>
                Tu cuenta ha sido verificada correctamente.
                Ya puedes iniciar sesión y comenzar a utilizar tu cuenta de
                Café Paraíso.
            </p>

            <div class="confirmation-actions">
                <a
                    href="login.html"
                    class="caracol-btn caracol-btn-primary"
                >
                    Iniciar sesión
                    <i class="bi bi-arrow-right"></i>
                </a>

                <a
                    href="index.html"
                    class="confirmation-back"
                >
                    Volver al inicio
                </a>
            </div>

            <p class="confirmation-security">
                <i class="bi bi-shield-check"></i>
                Tu cuenta está protegida.
            </p>
        </section>
    </main>
</body>
</html>
